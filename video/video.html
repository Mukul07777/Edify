<!doctype html>
<!-- The demo video as a page: seek(t) draws the picture for second t, and render.mjs photographs it frame by frame.
     Open with ?t=42 to look at one moment, or ?play=1 to watch it roughly in real time (no sound). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edify demo video</title>
<style>
@font-face { font-family: "Fraunces"; src: url("../frontend/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Fraunces"; src: url("../frontend/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
@font-face { font-family: "Geist"; src: url("../frontend/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("../frontend/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
:root { --stone: #f4f3ef; --ink: #121211; --muted: #6b6a65; --hl: #4b55c9; --amber: #d07a1c; --ok: #2f7d4a; --bad: #c2353a; --night: #100f0d; --cream: #f4ece0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
body { font-family: "Geist", "Nirmala UI", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--stone); }
.scene { position: absolute; inset: 0; overflow: hidden; display: none; }
.scene.light { background: var(--stone); color: var(--ink); }
.scene.dark { background: var(--night); color: var(--cream); }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
.light .blob.b1 { width: 900px; height: 900px; left: -260px; top: -320px; background: #f3dcc8; opacity: .75; }
.light .blob.b2 { width: 800px; height: 800px; right: -240px; bottom: -340px; background: #dcdcf6; opacity: .8; }
.dark .blob.b1 { width: 900px; height: 900px; left: -300px; top: -360px; background: #2b2f86; opacity: .5; }
.dark .blob.b2 { width: 820px; height: 820px; right: -280px; bottom: -380px; background: #7a3414; opacity: .42; }

/* ---------- a browser window showing a filmed screen ---------- */
.win { position: absolute; border-radius: 18px; background: #fff; overflow: hidden; transform-origin: 50% 50%;
  box-shadow: 0 50px 130px -30px rgba(18,18,17,.42), 0 12px 30px -12px rgba(18,18,17,.18), 0 0 0 1px rgba(18,18,17,.09); }

.win .bar { height: 40px; background: #eceae4; display: flex; align-items: center; gap: 8px; padding: 0 16px; position: relative; }
.win .bar i { width: 12px; height: 12px; border-radius: 50%; background: #d3d1ca; }
.win .bar i:nth-child(1) { background: #ec6a5e; } .win .bar i:nth-child(2) { background: #f4bf4f; } .win .bar i:nth-child(3) { background: #61c554; }
.win .url { position: absolute; left: 50%; top: 7px; transform: translateX(-50%); font: 500 13.5px "Geist"; color: #6b6a65; background: #f8f7f4; padding: 5px 22px; border-radius: 99px; white-space: nowrap; }
.win .vp { position: relative; overflow: hidden; background: var(--stone); }

.win .strip { position: absolute; overflow: hidden; }
.win .strip img { position: absolute; top: 0; width: 1440px; height: 810px; }

.hl { position: absolute; border-radius: 22px; opacity: 0; --c: var(--hl); --dim: 0;
  box-shadow: 0 0 0 4px var(--c), 0 0 0 12px color-mix(in srgb, var(--c) 22%, transparent), 0 0 0 4000px rgba(18,18,17,var(--dim)); }

/* ---------- labels, panels ---------- */
.tag { position: absolute; opacity: 0; white-space: nowrap; font: 600 22px "Geist"; padding: 12px 22px; border-radius: 99px; background: var(--ink); color: #fff; box-shadow: 0 18px 40px -12px rgba(18,18,17,.55); }
.tag.hl { background: var(--hl); } .tag.amber { background: var(--amber); } .tag.ok { background: var(--ok); } .tag.paper { background: #fff; color: var(--ink); box-shadow: 0 18px 40px -12px rgba(18,18,17,.35), 0 0 0 1px rgba(18,18,17,.08); }

.pillrow { display: flex; flex-direction: column; gap: 12px; }

/* ---------- heads-up: logo, section, progress, captions ---------- */

#cap { position: absolute; left: 50%; bottom: 34px; z-index: 55; max-width: 1560px; text-align: center; font: 500 35px/1.32 "Geist", "Nirmala UI"; color: #fff;
  background: rgba(14,14,13,.9); padding: 15px 34px 17px; border-radius: 22px; box-shadow: 0 20px 50px -18px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); opacity: 0; white-space: nowrap; }

/* ---------- hook ---------- */
.hk-card { left: 580px; top: 300px; width: 760px; padding: 44px 50px 46px; border-radius: 30px; background: #1c1a17; border: 1px solid rgba(246,239,227,.14); box-shadow: 0 50px 120px -40px #000; }
.hk-card .caps { color: #a4988a; } .hk-card .ttl { font: 600 84px/1.05 "Fraunces"; margin: 16px 0 26px; letter-spacing: -.02em; }
.pill { display: inline-block; font: 600 22px "Geist"; padding: 10px 20px; border-radius: 99px; }
.pill.bad { background: rgba(240,137,141,.16); color: #f0898d; border: 1px solid rgba(240,137,141,.4); }
.qm { font: 600 120px "Fraunces"; color: #e8b46a; opacity: 0; }

.node .caps { color: #a4988a; font-size: 14px; } .node .nm { font: 600 44px "Fraunces"; margin-top: 6px; }
.node.gap { border: 2px solid #e8b46a; background: #2a2010; }
.node .stamp { position: absolute; right: -24px; top: -20px; font: 700 20px "Geist"; letter-spacing: .14em; padding: 9px 18px; border-radius: 99px; background: #e8b46a; color: #1a1205; transform: rotate(6deg); }
.node .sym { position: absolute; right: 26px; top: 30px; font: 600 16px "Geist"; letter-spacing: .16em; text-transform: uppercase; color: #f0898d; border: 1px solid rgba(240,137,141,.5); padding: 6px 12px; border-radius: 99px; }

/* ---------- problem ---------- */
.board { left: 150px; top: 150px; width: 770px; height: 500px; border-radius: 26px; background: #1d3229; border: 10px solid #3b2a1c; padding: 34px 40px; color: #eef3ea; font: 500 46px/1.42 "Fraunces"; font-style: italic; box-shadow: 0 50px 100px -40px #000; }
.board .t { font-style: normal; text-decoration: underline; text-underline-offset: 8px; }
.nbook { left: 1000px; top: 150px; width: 770px; height: 500px; border-radius: 12px; padding: 30px 44px 30px 90px; color: #26334f; font: 500 44px/62px "Fraunces"; font-style: italic;
  background: repeating-linear-gradient(#fbfaf5 0 60px, #cfd8e6 60px 62px); box-shadow: 0 50px 100px -40px #000; }
.nbook::before { content: ""; position: absolute; left: 66px; top: 0; bottom: 0; width: 2px; background: #e7a3a3; }
.meter { left: 150px; top: 716px; width: 1620px; display: flex; gap: 40px; }
.meter > div { flex: 1; } .meter .caps { color: #a4988a; display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 17px; }
.meter .trk { height: 16px; border-radius: 99px; background: rgba(246,239,227,.12); overflow: hidden; } .meter .fill { height: 100%; border-radius: 99px; width: 0; }
.blk { position: absolute; left: 250px; width: 470px; height: 76px; border-radius: 16px; background: #1c1a17; border: 1px solid rgba(246,239,227,.18); display: flex; align-items: center; padding: 0 26px; font: 600 28px "Geist"; opacity: 0; }
.blk.top { background: #f4ece0; color: #15110e; } .blk.miss { background: transparent; border: 2.5px dashed #f0898d; color: #f0898d; }
.aid { position: absolute; font: 700 22px "Geist"; padding: 11px 22px; border-radius: 10px; background: #f1d7b0; color: #5a3a0a; opacity: 0; box-shadow: 0 10px 20px -8px #000; }

/* ---------- intro / close ---------- */
.word { font: 700 300px/1 "Fraunces"; letter-spacing: -.035em; white-space: nowrap; }
.word span { display: inline-block; }
.chip { position: absolute; opacity: 0; font: 600 24px "Geist"; padding: 14px 24px; border-radius: 18px; background: #fff; box-shadow: 0 22px 44px -18px rgba(18,18,17,.4), 0 0 0 1px rgba(18,18,17,.07); display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.chip i { width: 14px; height: 14px; border-radius: 50%; background: var(--hl); display: block; }

/* ---------- languages ---------- */
.lang { display: inline-block; font: 600 30px "Geist", "Nirmala UI"; padding: 12px 26px; border-radius: 99px; background: #fff; margin: 0 7px; box-shadow: 0 0 0 1px rgba(18,18,17,.1); opacity: 0; }

/* ---------- more ---------- */
.tile { position: absolute; width: 540px; opacity: 0; border-radius: 16px; overflow: hidden; box-shadow: 0 40px 80px -30px #000, 0 0 0 1px rgba(246,239,227,.16); }
.tile img { display: block; width: 540px; }
.tlab { position: absolute; opacity: 0; font: 600 24px "Geist"; padding: 10px 20px; border-radius: 99px; background: #f4ece0; color: #15110e; box-shadow: 0 14px 30px -10px #000; white-space: nowrap; }
.phone { position: absolute; width: 300px; height: 650px; border-radius: 42px; border: 9px solid #26221d; background: #000; overflow: hidden; opacity: 0; box-shadow: 0 50px 100px -30px #000, 0 0 0 1px rgba(246,239,227,.2); }
.phone img { width: 100%; display: block; }

/* ---------- cost ---------- */
.dots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.dots i { width: 38px; height: 38px; border-radius: 50%; background: rgba(18,18,17,.1); display: block; }

/* ---------- light restyle of the former dark scenes ---------- */
.hk-card, .hk-re, .node, .blk { background: #fff; color: var(--ink); border: 1px solid rgba(18,18,17,.1); box-shadow: 0 30px 70px -30px rgba(18,18,17,.35); }
.node.gap { background: #fdf1e1; border: 2px solid var(--amber); }
.hk-re { border-style: dashed; } .hk-re .ic { background: rgba(18,18,17,.06); }
.hk-card .caps, .node .caps, .meter .caps { color: var(--muted); }
.qm, .hk-h1 em { color: var(--amber); }
.pill.bad, .node .sym { color: var(--bad); border-color: rgba(194,53,58,.45); background: rgba(194,53,58,.08); }
.node .stamp { background: var(--amber); color: #fff; }
#hkline { stroke: var(--amber); }
.scene.light [style*="#e8b46a"] { color: var(--amber) !important; }
.scene.light [style*="#a4988a"] { color: var(--muted) !important; }
.meter .trk { background: rgba(18,18,17,.1); }
.blk.top { background: var(--ink); color: #fff; } .blk.miss { background: #fff; border-color: var(--bad); color: var(--bad); }
.board, .nbook { box-shadow: 0 40px 80px -36px rgba(18,18,17,.45); }
.tile { box-shadow: 0 30px 70px -30px rgba(18,18,17,.45), 0 0 0 1px rgba(18,18,17,.1); }
.tlab { background: var(--ink); color: #fff; box-shadow: 0 14px 30px -12px rgba(18,18,17,.5); }
.phone { box-shadow: 0 40px 80px -30px rgba(18,18,17,.5); }
.close-logo { filter: invert(1); }
</style>

<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="hud"><div class="brand"><img src="../frontend/public/logo-mark.png"><span>Edify</span></div><div class="sec"><b></b><span></span></div></div>
  <div id="cap"></div>
  <div id="prog"></div>
</div>
<script src="data.js"></script>
<script>
"use strict";
const D = window.DATA, stage = document.getElementById("stage"), host = document.getElementById("scenes");
const E = {
  lin: (t) => t, out3: (t) => 1 - Math.pow(1 - t, 3), out5: (t) => 1 - Math.pow(1 - t, 5),
  inout: (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  back: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b, e = E.out3) => e(cl((t - a) / (b - a)));          // 0 → 1 between times a and b
const mix = (a, b, k) => a + (b - a) * k;
const h = (tag, cls, html, parent) => { const el = document.createElement(tag); if (cls) el.className = cls; if (html) el.innerHTML = html; (parent || host).appendChild(el); return el; };
/** opacity + transform in one go; the transform is always rewritten so nothing lingers from an earlier frame */
function S(el, o) {
  if (o.o !== undefined) el.style.opacity = cl(o.o);
  el.style.transform = `translate(${o.x || 0}px,${o.y || 0}px) scale(${o.s === undefined ? 1 : o.s}) rotate(${o.r || 0}deg)`;
}
/** an element arriving: fades up, settles with a small overshoot */
function pop(el, t, at, { dur = .55, y = 34, s = .86, x = 0, r = 0, out = null, outDur = .3 } = {}) {
  const k = P(t, at, at + dur, E.back), f = P(t, at, at + dur * .6), gone = out === null ? 0 : P(t, out, out + outDur, E.inout);
  S(el, { o: f * (1 - gone), y: mix(y, 0, k) - gone * 20, x: mix(x, 0, k), s: mix(s, 1, k) * (1 - gone * .06), r });
}
const img = (name) => `<img data-src="assets/${name}.jpg">`;

// ------------------------------------------------------------------ the browser window
class Win {
  constructor(parent, { shots, x = 240, y = 52, scale = 1, url = "edify.app" }) {
    this.scale = scale; this.first = shots[0];
    const m = D.shots[shots[0]];
    this.el = h("div", "win", "", parent);
    Object.assign(this.el.style, { left: x + "px", top: y + "px", width: 1440 * scale + "px" });
    this.el.innerHTML = `<div class="bar"><i></i><i></i><i></i><span class="url">${url}</span></div><div class="vp" style="height:${810 * scale}px"><div class="cam"></div></div>`;
    this.cam = this.el.querySelector(".cam");
    this.pages = {};
    for (const s of shots) {
      const tall = D.shots[s].tallH > 810;
      this.pages[s] = h("div", "pg", img(tall ? s + "_tall" : s), this.cam);
      this.pages[s].style.opacity = s === shots[0] ? 1 : 0;
    }
    if (m.region) {   // the sidebar and the top bar stay put while the page scrolls under them
      const r = m.region;
      const side = h("div", "strip", img(shots[0]), this.cam); Object.assign(side.style, { left: 0, top: 0, width: r.x + "px", height: "810px" });
      const top = h("div", "strip", img(shots[0]), this.cam); Object.assign(top.style, { left: r.x + "px", top: 0, width: 1440 - r.x + "px", height: r.y + "px" });
      top.firstChild.style.left = -r.x + "px";
    }
    this.hls = h("div", "hls", "", this.cam);
    this.cur = h("div", "cur", `<svg viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.6 4 7.3-2.9 1.6-4-7.4L4 19z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="rip"></span>`, this.cam);
    this.set({});
  }
  hl(rect, cls = "", grow = 8) {
    const el = h("div", "hl " + cls, "", this.hls);
    Object.assign(el.style, { left: rect.x - grow + "px", top: rect.y - grow + "px", width: rect.w + grow * 2 + "px", height: rect.h + grow * 2 + "px" });
    return el;
  }
  note(x, y, text, cls = "") { const el = h("div", "note " + cls, text, this.hls); Object.assign(el.style, { left: x + "px", top: y + "px" }); return el; }
  /** scroll: page px; k: zoom; cx, cy: what the zoom centres on, in the window's own 1440x810 */
  set({ scroll = 0, k = 1, cx = 720, cy = 405, show = null }) {
    const zx = cl(cx - 720 / k, 0, 1440 - 1440 / k), zy = cl(cy - 405 / k, 0, 810 - 810 / k);
    this.cam.style.transform = `scale(${this.scale * k}) translate(${-zx}px,${-zy}px)`;
    for (const [name, pg] of Object.entries(this.pages)) {
      pg.style.transform = `translateY(${-Math.max(0, scroll)}px)`;   // past a page's end is fine: the next state fades in over it
      if (show) pg.style.opacity = show[name] ?? 0;
    }
    this.hls.style.transform = `translateY(${-scroll}px)`;
  }
  /** the pointer at (x, y) in the window's 1440x810; click: 0 → 1 draws the ring */
  point(x, y, o, click = 0) {
    this.cur.style.opacity = o; this.cur.style.transform = `translate(${x}px,${y}px) scale(${1 - .14 * Math.sin(Math.PI * cl(click * 2))})`;
    const rip = this.cur.querySelector(".rip"); rip.style.opacity = click > 0 && click < 1 ? 1 - click : 0; rip.style.transform = `scale(${.3 + click * 1.5})`;
  }
}
/** highlight box: appears, optionally dims the rest of the page */
const glow = (el, t, at, { out = null, dim = 0 } = {}) => {
  const k = P(t, at, at + .45, E.back), gone = out === null ? 0 : P(t, out, out + .3);
  el.style.opacity = P(t, at, at + .25) * (1 - gone); el.style.transform = `scale(${mix(1.06, 1, k)})`; el.style.setProperty("--dim", dim * P(t, at, at + .5) * (1 - gone));
};

// ------------------------------------------------------------------ scenes
const scenes = [];
function scene(id, theme, section, build) {
  const data = D.scenes.find((s) => s.id === id);
  const el = h("div", `scene ${theme}`, `<div class="blob b1"></div><div class="blob b2"></div>`);
  const at = (i, f = 0) => data.lines[i].t0 + data.lines[i].dur * f;      // a moment inside line i, as a fraction of it
  scenes.push({ id, el, data, theme, section, draw: build(el, data, at) });
}

// 1. hook: the symptom, the re-teaching, the real gap
scene("hook", "light", null, (el, d, at) => {
  const card = h("div", "abs hk-card", `<div class="caps">JEE · Physics · Class 11</div><div class="ttl">Rotational Motion</div><span class="pill bad">✕ &nbsp;samajh nahi aa raha</span>`, el);
  const pill = card.querySelector(".pill");
  const qs = [[420, 250, -14], [1420, 210, 12], [1500, 560, 20], [330, 600, -8], [1250, 90, 6]].map(([x, y, r]) => { const q = h("div", "abs qm", "?", el); q.style.left = x + "px"; q.style.top = y + "px"; q.dataset.r = r; return q; });

// ------------------------------------------------------------------ the frame for second T
const cap = document.getElementById("cap"), prog = document.getElementById("prog"), hud = document.getElementById("hud");
const brand = hud.querySelector(".brand"), sec = hud.querySelector(".sec");
function activate(sc, on) {
  if (sc.on === on) return;
  sc.on = on; sc.el.style.display = on ? "block" : "none";
  for (const im of sc.el.querySelectorAll("img[data-src]")) { if (on) im.src = im.dataset.src; else im.removeAttribute("src"); }
}
async function seek(T) {
  T = cl(T, 0, D.total - 1e-3);
  let cur = scenes[0];
  scenes.forEach((sc, i) => {
    const s = sc.data.start, e = s + sc.data.dur, on = T >= s - .05 && T < e + D.xf;
    activate(sc, on);
    if (!on) return;
    if (T >= s) cur = sc;
    const enter = i === 0 ? 1 : P(T, s, s + D.xf, E.inout);
    sc.el.style.zIndex = i + 1; sc.el.style.opacity = enter;
    sc.el.style.transform = `scale(${mix(1.04, 1, enter)})`;
    const b = sc.el.querySelectorAll(".blob"); b[0].style.transform = `translate(${Math.sin(T * .35 + i) * 60}px,${Math.cos(T * .3) * 40}px)`; b[1].style.transform = `translate(${Math.cos(T * .32 + i) * 60}px,${Math.sin(T * .27) * 50}px)`;
    sc.draw(T - s);
  });
  // heads-up: brand and section on the screen-tour scenes, the progress line always
  const lt = T - cur.data.start, show = cur.section ? P(lt, .1, .5) * (1 - P(lt, cur.data.dur - .1, cur.data.dur + D.xf)) : 0, n = scenes.filter((s) => s.section).indexOf(cur) + 1;
  brand.style.opacity = sec.style.opacity = show; brand.style.color = cur.theme === "dark" ? "#f4ece0" : "#121211"; brand.firstChild.style.filter = cur.theme === "dark" ? "none" : "invert(1)";
  if (cur.section) { sec.firstChild.textContent = String(n).padStart(2, "0"); sec.lastChild.textContent = cur.section; }
  prog.style.width = (T / D.total) * 1920 + "px";
  // caption: the piece of the line being said
  let text = "", o = 0, rise = 0;
  for (const line of cur.data.lines) for (const c of line.caps) {
    if (lt >= c.t0 - .05 && lt < c.t1 + (c === line.caps.at(-1) ? .18 : 0)) { text = c.text; o = P(lt, c.t0 - .05, c.t0 + .1) * (c === line.caps.at(-1) ? 1 - P(lt, c.t1, c.t1 + .18) : 1); rise = 1 - P(lt, c.t0 - .05, c.t0 + .2, E.out5); }
  }
  if (text) cap.textContent = text;
  cap.style.opacity = o; cap.style.transform = `translate(-50%, ${rise * 14}px)`;
  // every picture this frame needs is decoded before the photograph
  await Promise.all([...stage.querySelectorAll("img[src]")].map((im) => im.decode().catch(() => {})));
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
}
window.seek = seek;
window.ready = (async () => { await document.fonts.load("600 40px Fraunces"); await document.fonts.load("italic 600 40px Fraunces"); await document.fonts.load("600 20px Geist"); await document.fonts.load("500 20px 'Geist Mono'"); await document.fonts.ready; })();

const q = new URLSearchParams(location.search);
const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
if (!q.has("raw")) { fit(); addEventListener("resize", fit); }
window.ready.then(async () => {
  if (q.has("play")) { const t0 = performance.now() - (+q.get("t") || 0) * 1000; const loop = async () => { await seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); }
  else await seek(+q.get("t") || 0);
});
